name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q
        # the suite is known-answer tests on synthetic data: no dataset
        # downloads happen in CI, so a green run certifies the statistics
        # and the SQL, not the data files
